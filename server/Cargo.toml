[package]
name = "noob_tube_server"
version.workspace = true
edition.workspace = true
license.workspace = true

# Headless: no rendering, no windowing, no audio. Bevy's default features stay off.
[dependencies]
noob_tube_shared = { workspace = true }
avian3d = { workspace = true }
bevy = { workspace = true, features = ["bevy_log", "bevy_state"] }
lightyear = { workspace = true }
# Map manifests. The heights are binary because they have to be; everything else is JSON
# because it changes constantly while the design is young — see terrain.md §1.
serde_json = { workspace = true }

[features]
remote = ["noob_tube_shared/remote"]
