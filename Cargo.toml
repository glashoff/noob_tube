[workspace]
resolver = "3"
members = ["shared", "client", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
noob_tube_shared = { path = "shared" }
bevy = { version = "0.19.1", default-features = false }
lightyear = { version = "0.29", features = ["udp", "netcode"] }

# Physics is queries-only: parry's shape casts plus rapier's broad-phase BVH.
# PhysicsPipeline::step() is never called for gameplay. See README, "Two kinds of physics".
# The `-glamx0.2` build is compiled against glam 0.32, the same version Bevy 0.19 uses, so
# rapier's Vector/Pose ARE Bevy's Vec3/Isometry3d — no conversion at the boundary. Plain
# rapier3d 0.35.3 pulls glam 0.33 and every vector would need translating.
rapier3d = "=0.35.0-glamx0.2"

[profile.dev]
opt-level = 1

# Dependencies stay optimised in dev builds — physics and networking are unusable otherwise.
[profile.dev.package."*"]
opt-level = 3
