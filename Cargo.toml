[workspace]
resolver = "3"
members = ["shared", "client", "server", "tools/bake_collider", "tools/bake_ground_maps", "tools/import_heightmap"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
noob_tube_shared = { path = "shared" }
# The client depends on this to run `noob_tube_client server`. It is a library with a thin
# binary on top, and the binary is what gets deployed.
noob_tube_server = { path = "server" }
bevy = { version = "0.19.1", default-features = false, features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
# For terrain map manifests. See terrain.md §1: the heights are binary because they have to
# be, and everything else is JSON because it changes constantly while the design is young.
serde_json = "1"
# Logging from the metadata thread, which runs outside the ECS. Bevy's `info!` and friends come
# from bevy_log, which the shared crate does not pull in — it builds bevy with default features off.
tracing = "0.1"
# The network config: read from a file, and served over the metadata endpoint so a client can
# adopt the server's tick rate. Chosen over RON because the file is meant to be edited by hand
# between rounds, and TOML is the format a Rust developer already has in front of them.
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] }
# `frame_interpolation` draws the predicted player blended between fixed ticks, and is what
# visual correction after a rollback is built on — the correction decays the difference
# between the frame the last update drew and the one the replay produced.
# `webtransport` rather than `udp`, and on the native build too. A browser has no
# UDP socket, and a second transport kept for native alone would be the one that gets exercised
# while the one every player uses rots. `webtransport_self_signed` is what mints the development
# certificate; a deployment hands the server a real one.
lightyear = { version = "0.29", features = [
    "webtransport",
    "webtransport_self_signed",
    "netcode",
    "input_native",
    "frame_interpolation",
] }
# Taken as a subcrate rather than through `bevy/bevy_remote`, because that feature also switches on
# `serialize` across bevy_internal: toggling `remote` would then invalidate the whole cached Bevy
# tree. It does not buy a wgpu-free server — bevy_remote depends on bevy_dev_tools unconditionally,
# and that reaches bevy_render. Keep the version in lockstep with bevy.
bevy_remote = { version = "0.19.1", default-features = false, features = ["http"] }

# Physics: level collision, spatial queries, and (from vehicles on) simulated bodies.
# `default-features = false` keeps the debug renderer, picking and mesh conversion out of the
# headless server; `parry-f32` is what switches on the `Collider` type at all.
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32"] }
# Replication and rollback for Avian bodies. Its `3d` feature switches on `avian3d/serialize`,
# which is what makes Position and Rotation sendable at all.
lightyear_avian3d = { version = "0.29", default-features = false, features = ["std", "3d", "f32"] }

[profile.dev]
opt-level = 1
# Enough debug info to keep the file and line in a panic, and nothing else. Full debug info is for
# a debugger, and dominates the build directory: every cached feature combination of the Bevy tree
# carries its own copy, which is how `target/` reached 113 GB and filled the disk twice.
debug = "line-tables-only"

# What the browser client is built with, and it is a third profile rather than `release` because
# the two want opposite things. A native release is optimised for speed on a machine that has
# already downloaded it; a wasm bundle is downloaded *every time somebody opens the page*, and
# 165 MB of plain `release` is not a bundle, it is a refusal to load.
#
# `opt-level = "s"` costs a few percent of frame time and saves far more than a few percent of size.
# Fat LTO and a single codegen unit are what actually collapse it: this tree instantiates an
# enormous number of generics across Bevy, Avian and lightyear, and nothing but whole-program
# optimisation can see that most of them are dead. `panic = "abort"` is free here — wasm has no
# unwinding to give up, and the panic hook still prints before it stops.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Dependencies stay optimised in dev builds — physics and networking are unusable otherwise.
[profile.dev.package."*"]
opt-level = 3
# And carry no debug info at all. A backtrace through Bevy or lightyear loses its line numbers;
# panics in our own code, which is where the ones worth reading come from, keep theirs.
debug = false

# Bevy 0.19.1 promises `min_binding_size = 16` for the mesh view bind group's visibility-range
# buffer, which is right only where that binding is a storage buffer. Wherever there are none —
# WebGL2 — the shader takes the uniform branch and declares a fixed `array<vec4<f32>, 64>`, so
# 1024 bytes are required and every PBR pipeline fails validation, which takes the whole client
# down. Reported upstream as bevyengine/bevy#21309 in October 2025 and untouched since; this
# revision is that fix on top of the v0.19.1 tag, offered back as a pull request.
#
# **Every Bevy crate, and it has to be every one.** The crates in Bevy's repository depend on each
# other by `path`, so patching one drags its siblings out of the repository too — while the crates
# still coming from crates.io keep using the crates.io siblings. That leaves two copies of
# `bevy_camera`, `bevy_mesh` and thirty-five others in the graph, whose types are not each other's,
# and the build fails with six hundred errors that say nothing about the patch. A published
# `.crate` has its `path` entries stripped, which is why patching one crate from a local unpacked
# copy appears to work and patching one crate from git does not.
#
# Pinned by revision, never by branch: a branch would silently change what this builds against.
# Delete the whole section once a Bevy release carries the fix.
[patch.crates-io]
bevy                     = { git = "https://github.com/glashoff/bevy", rev = "2a8df6057a370d95287e0518f4b22e31be77d269" }
