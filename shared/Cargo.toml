[package]
name = "noob_tube_shared"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
avian3d = { workspace = true }
bevy = { workspace = true }
lightyear = { workspace = true }
lightyear_avian3d = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
bevy_remote = { workspace = true, optional = true }

[features]
# Opens a Bevy Remote Protocol endpoint for live inspection. Off by default: the protocol can
# mutate the world, not just read it, so it must never reach a release build.
remote = ["dep:bevy_remote"]

[dev-dependencies]
# The format lightyear puts messages in. One test encodes a baseline with it, because a binary
# format with no field names is the only thing that can catch a `skip_serializing_if` that JSON
# would have forgiven — and it did, after the wire had already broken once.
postcard = { version = "1.1", features = ["use-std"] }
