[package]
name = "noob_tube_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
noob_tube_shared = { workspace = true }
avian3d = { workspace = true }
# `jpeg` is not in Bevy's defaults, and a glTF whose textures are JPEG loads its geometry and then
# fails on the images — visibly, as an untextured model, with one line in the log. Vehicle assets
# are the first thing here to bring their own textures.
bevy = { workspace = true, features = ["default", "jpeg"] }
lightyear = { workspace = true }
# The recording format is JSON lines, so that grep, jq and a text editor all work on a trace and
# nothing has to be written to read one.
serde = { workspace = true }
serde_json = { workspace = true }
# What a player's own settings are written in, the same format `noob_tube.toml` is: a settings file
# is one somebody may open and edit, and it already comes with the workspace for `shared`.
toml = { workspace = true }
# In-process inspector window. Its egui and bevy_egui versions are tied to this exact release,
# so it moves in lockstep with Bevy just as bevy_remote does.
bevy-inspector-egui = { version = "0.37", optional = true }
# Adds BRP methods for screenshots and synthetic input, which is what lets an agent drive the
# running game the way the harness does.
bevy_brp_extras = { version = "0.22.5", optional = true }

# The renderer, and it has to be said explicitly: Bevy's default features contain neither `webgpu`
# nor `webgl2`, so a wasm build with neither draws nothing at all. WebGPU rather than WebGL2 —
# web.md §3 has the browser table and the one gap it leaves, which is Firefox on Linux.
# `noob_tube_client server` runs the dedicated server out of this binary, so that one build
# produces both sides of a local round and they cannot drift apart between two compiles.
#
# Native only. The server listens over WebTransport and mints its own certificate, which is
# `wtransport` and `rustls-pemfile` — neither builds for wasm, and a page has nothing to listen
# with anyway. `main` gates the argument on the same condition.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
noob_tube_server = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
bevy = { workspace = true, features = ["default", "jpeg", "webgpu"] }
# The browser's side of `platform.rs`: the query parameters that stand in for environment
# variables, the storage the settings live in, and the clock. Versions pinned to what Bevy and
# lightyear already pull in — `wasm-bindgen` in particular has to match the CLI that generates the
# bindings, so two of them in one build is a link error rather than a warning.
js-sys = "0.3.104"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = [
    "Window",
    "Location",
    "UrlSearchParams",
    "Storage",
    "Document",
    "Element",
    "console",
] }

[dev-dependencies]
# Only a test needs to read a PNG on its own: the one that checks the layer colours in
# `default_layers` still match the textures they were measured from. Bevy already pulls this exact
# version in, so it costs nothing but a line.
# PNG alone: the default feature set brings a dozen codecs this has no use for, and with them four
# hundred lines of lockfile.
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Bevy in a shared object instead of a static archive, so that editing our own code relinks against
# it rather than pulling the whole engine through the linker again. On by default because the dev
# loop is where nearly every build happens; a release build has to pass `--no-default-features`, or
# the binary comes out needing `libbevy_dylib.so` beside it. Nothing else lives in `default`, so
# turning defaults off costs nothing. `deploy.sh` only ever builds the server, and builds it with
# `-p`, so this never reaches the deployed binary.
default = ["bevy/dynamic_linking"]
remote = ["noob_tube_shared/remote", "noob_tube_server/remote", "dep:bevy_brp_extras"]
inspector = ["dep:bevy-inspector-egui"]
