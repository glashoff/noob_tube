[package]
name = "noob_tube_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
noob_tube_shared = { workspace = true }
avian3d = { workspace = true }
# `jpeg` is not in Bevy's defaults, and a glTF whose textures are JPEG loads its geometry and then
# fails on the images — visibly, as an untextured model, with one line in the log. Vehicle assets
# are the first thing here to bring their own textures.
bevy = { workspace = true, features = ["default", "jpeg"] }
lightyear = { workspace = true }
# The recording format is JSON lines, so that grep, jq and a text editor all work on a trace and
# nothing has to be written to read one.
serde = { workspace = true }
serde_json = { workspace = true }
# In-process inspector window. Its egui and bevy_egui versions are tied to this exact release,
# so it moves in lockstep with Bevy just as bevy_remote does.
bevy-inspector-egui = { version = "0.37", optional = true }
# Adds BRP methods for screenshots and synthetic input, which is what lets an agent drive the
# running game the way the harness does.
bevy_brp_extras = { version = "0.22.5", optional = true }

[dev-dependencies]
# Only a test needs to read a PNG on its own: the one that checks the layer colours in
# `default_layers` still match the textures they were measured from. Bevy already pulls this exact
# version in, so it costs nothing but a line.
# PNG alone: the default feature set brings a dozen codecs this has no use for, and with them four
# hundred lines of lockfile.
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
remote = ["noob_tube_shared/remote", "dep:bevy_brp_extras"]
inspector = ["dep:bevy-inspector-egui"]
